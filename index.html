<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسه حافظ</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f4ff;color:#222;direction:rtl;min-height:100vh}

.header{background:linear-gradient(135deg,#6C3FC5,#E91E8C);color:white;padding:24px 20px;text-align:center}
.header-icon{font-size:2.8rem;margin-bottom:8px}
.header h1{font-size:1.6rem;font-weight:800;letter-spacing:1px}
.header p{font-size:0.85rem;opacity:0.85;margin-top:5px}

.stats{display:flex;justify-content:center;gap:24px;margin-top:16px}
.stat{text-align:center}
.stat-num{font-size:1.4rem;font-weight:800}
.stat-lbl{font-size:0.72rem;opacity:0.8}

.container{max-width:640px;margin:0 auto;padding:20px 14px}

.session-card{background:white;border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 3px 14px rgba(108,63,197,0.10)}

.session-header{
  padding:16px 18px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#6C3FC5,#9B59B6);
  color:white;user-select:none;
}
.session-header h2{font-size:1rem;font-weight:700}
.session-badge{background:rgba(255,255,255,0.25);border-radius:20px;padding:3px 10px;font-size:0.78rem}
.arrow{font-size:0.9rem;transition:transform 0.3s}
.session-header.open .arrow{transform:rotate(180deg)}

.session-body{display:none;padding:14px;background:#fdfcff}
.session-body.open{display:block}

.lesson-card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;border:1.5px solid #ede8ff;position:relative}
.lesson-card:last-child{margin-bottom:0}

.lesson-num{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#E91E8C,#FF6B9D);color:white;font-size:0.75rem;font-weight:800;display:flex;align-items:center;justify-content:center}

.lesson-title{font-size:0.95rem;font-weight:700;color:#333;margin-bottom:3px;padding-left:36px}
.lesson-meta{font-size:0.75rem;color:#bbb;margin-bottom:8px;padding-left:36px}
.lesson-desc{font-size:0.83rem;color:#666;margin-bottom:12px;line-height:1.6}

video{width:100%;border-radius:10px;background:#111;max-height:220px;display:block}

/* VIDEO THUMBNAIL OVERLAY */
.video-wrap{position:relative;border-radius:10px;overflow:hidden;background:#1a1a2e;min-height:160px}

.video-thumb{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#1a1a2e,#2d1b69);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background 0.2s;
  border-radius:10px;
}
.video-thumb:hover{background:linear-gradient(135deg,#2d1b69,#4a2a99)}
.video-thumb.hide{display:none}

.play-circle{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,#E91E8C,#FF6B9D);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
  box-shadow:0 4px 20px rgba(233,30,140,0.4);
}
.play-circle svg{width:28px;height:28px;fill:white;margin-right:-4px}
.play-label{color:white;font-size:0.85rem;opacity:0.85}

.video-buffering{
  position:absolute;inset:0;
  background:rgba(26,26,46,0.85);
  display:none;align-items:center;justify-content:center;
  border-radius:10px;
  flex-direction:column;gap:8px;
  color:white;font-size:0.82rem;
}
.video-buffering.show{display:flex}
.spinner-sm{width:28px;height:28px;border:3px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:60px 20px;color:#bbb}
.empty-icon{font-size:3rem;margin-bottom:12px}
.loading{text-align:center;padding:50px;color:#9B59B6}
.spinner{width:36px;height:36px;border:4px solid #e8e0f7;border-top-color:#6C3FC5;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}

.footer{text-align:center;padding:24px;color:#ccc;font-size:0.78rem}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📚</div>
  <h1>مدرسه حافظ</h1>
  <p>درسهای فارسی – صنف اول</p>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalSessions">۰</div><div class="stat-lbl">جلسه</div></div>
    <div class="stat"><div class="stat-num" id="totalLessons">۰</div><div class="stat-lbl">درس</div></div>
  </div>
</div>

<div class="container">
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      در حال بارگذاری...
    </div>
  </div>
</div>

<div class="footer">مدرسه حافظ © ۱۴۰۳</div>

<script>
const LESSONS_URL = "https://raw.githubusercontent.com/hafizschool340-alt/hafiz-school/main/lessons.json";
const toF = n => String(n).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

function buildLessonCard(lesson, li) {
  const lc = document.createElement("div");
  lc.className = "lesson-card";

  // Header info
  const info = document.createElement("div");
  info.innerHTML = `
    <div class="lesson-num">${toF(li+1)}</div>
    <div class="lesson-title">${lesson.title}</div>
    <div class="lesson-meta">${lesson.date||""}${lesson.duration ? "  ⏱ "+lesson.duration+" دقیقه" : ""}</div>
    ${lesson.description ? `<div class="lesson-desc">${lesson.description}</div>` : ""}`;
  lc.appendChild(info);

  // Video wrap
  const wrap = document.createElement("div");
  wrap.className = "video-wrap";

  // Video element — NO src yet
  const vid = document.createElement("video");
  vid.controls = true;
  vid.playsInline = true;
  wrap.appendChild(vid);

  // Buffering indicator
  const buf = document.createElement("div");
  buf.className = "video-buffering";
  buf.innerHTML = `<div class="spinner-sm"></div><span>در حال بارگذاری...</span>`;
  wrap.appendChild(buf);

  // Play overlay — کلیک اینجا src را set میکند
  const thumb = document.createElement("div");
  thumb.className = "video-thumb";
  thumb.innerHTML = `
    <div class="play-circle">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <span class="play-label">برای پخش کلیک کنید</span>`;

  thumb.addEventListener("click", () => {
    thumb.classList.add("hide");
    buf.classList.add("show");
    // ✅ src فقط اینجا set میشود
    vid.src = lesson.videoUrl;
    vid.load();
    vid.addEventListener("canplay", () => {
      buf.classList.remove("show");
      vid.play();
    }, { once: true });
    vid.addEventListener("error", () => {
      buf.classList.remove("show");
      buf.innerHTML = `<span>❌ خطا در بارگذاری ویدیو</span>`;
      buf.classList.add("show");
    }, { once: true });
  });

  wrap.appendChild(thumb);
  lc.appendChild(wrap);
  return lc;
}

async function load() {
  const app = document.getElementById("app");
  try {
    const r = await fetch(LESSONS_URL + "?t=" + Date.now());
    const lessons = await r.json();

    if (!lessons.length) {
      app.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><p>هنوز درسی اضافه نشده</p></div>';
      return;
    }

    const sessions = {};
    lessons.forEach(l => {
      if (!sessions[l.session]) sessions[l.session] = [];
      sessions[l.session].push(l);
    });

    document.getElementById("totalSessions").textContent = toF(Object.keys(sessions).length);
    document.getElementById("totalLessons").textContent = toF(lessons.length);

    const nums = Object.keys(sessions).map(Number).sort((a,b) => a-b);
    app.innerHTML = "";

    nums.forEach((sNum, idx) => {
      const items = sessions[sNum];
      const card = document.createElement("div");
      card.className = "session-card";

      const hdr = document.createElement("div");
      hdr.className = "session-header" + (idx===0 ? " open" : "");
      hdr.innerHTML = `
        <h2>📖 جلسه ${toF(sNum)}</h2>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="session-badge">${toF(items.length)} درس</span>
          <span class="arrow">▼</span>
        </div>`;

      const body = document.createElement("div");
      body.className = "session-body" + (idx===0 ? " open" : "");

      items.forEach((lesson, li) => {
        body.appendChild(buildLessonCard(lesson, li));
      });

      hdr.addEventListener("click", () => {
        hdr.classList.toggle("open");
        body.classList.toggle("open");
      });

      card.appendChild(hdr);
      card.appendChild(body);
      app.appendChild(card);
    });

  } catch(e) {
    app.innerHTML = `<div class="empty"><div class="empty-icon">❌</div><p>خطا در بارگذاری</p><small>${e.message}</small></div>`;
  }
}

load();
</script>
</body>
</html>
