<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسه حافظ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f4ff;color:#222;direction:rtl;min-height:100vh}
.header{background:linear-gradient(135deg,#6C3FC5,#E91E8C);color:white;padding:20px 24px;text-align:center}
.header h1{font-size:1.5rem;font-weight:800}
.header p{font-size:0.85rem;opacity:0.85;margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:20px 16px}
.session-card{background:white;border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.session-header{background:linear-gradient(135deg,#6C3FC5,#9B59B6);color:white;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.session-header h2{font-size:1rem;font-weight:700}
.session-header span{font-size:1.2rem;transition:transform 0.3s}
.session-header.open span{transform:rotate(180deg)}
.session-body{display:none;padding:12px}
.session-body.open{display:block}
.lesson-card{background:#faf8ff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #e8e0f7}
.lesson-title{font-size:0.95rem;font-weight:700;color:#333;margin-bottom:4px}
.lesson-meta{font-size:0.78rem;color:#aaa;margin-bottom:10px}
.lesson-desc{font-size:0.85rem;color:#555;margin-bottom:12px}
video{width:100%;border-radius:10px;background:#000}
.empty{text-align:center;padding:60px 20px;color:#bbb}
.loading{text-align:center;padding:40px;color:#9B59B6;font-size:1rem}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:2.5rem;margin-bottom:8px">📚</div>
  <h1>مدرسه حافظ</h1>
  <p>درسهای فارسی — صنف اول</p>
</div>
<div class="container">
  <div id="app"><div class="loading">⏳ در حال بارگذاری...</div></div>
</div>
<script>
const LESSONS_URL = "https://raw.githubusercontent.com/hafizschool340-alt/hafiz-school/main/lessons.json";

async function load() {
  const app = document.getElementById("app");
  try {
    const r = await fetch(LESSONS_URL + "?t=" + Date.now());
    const lessons = await r.json();

    if (!lessons.length) {
      app.innerHTML = '<div class="empty">📭 هنوز درسی اضافه نشده<br><small>به زودی اولین درس منتشر میشود!</small></div>';
      return;
    }

    // Group by session
    const sessions = {};
    lessons.forEach(l => {
      if (!sessions[l.session]) sessions[l.session] = [];
      sessions[l.session].push(l);
    });

    const nums = Object.keys(sessions).sort((a,b) => b-a);
    app.innerHTML = "";

    nums.forEach((sNum, idx) => {
      const items = sessions[sNum];
      const card = document.createElement("div");
      card.className = "session-card";

      const hdr = document.createElement("div");
      hdr.className = "session-header" + (idx===0?" open":"");
      hdr.innerHTML = `<h2>📖 جلسه ${toFarsi(sNum)} <small style="opacity:0.7;font-size:0.8rem">(${toFarsi(items.length)} درس)</small></h2><span>▼</span>`;

      const body = document.createElement("div");
      body.className = "session-body" + (idx===0?" open":"");

      items.forEach(lesson => {
        const lc = document.createElement("div");
        lc.className = "lesson-card";
        lc.innerHTML = `
          <div class="lesson-title">🎬 ${lesson.title}</div>
          <div class="lesson-meta">📅 ${lesson.date || ""}  ${lesson.duration ? "⏱ "+toFarsi(lesson.duration)+" دقیقه" : ""}</div>
          ${lesson.description ? `<div class="lesson-desc">${lesson.description}</div>` : ""}
          <video controls preload="metadata" src="${lesson.videoUrl}"></video>
        `;
        body.appendChild(lc);
      });

      hdr.addEventListener("click", () => {
        hdr.classList.toggle("open");
        body.classList.toggle("open");
      });

      card.appendChild(hdr);
      card.appendChild(body);
      app.appendChild(card);
    });

  } catch(e) {
    app.innerHTML = '<div class="empty">❌ خطا در بارگذاری<br><small>' + e.message + '</small></div>';
  }
}

function toFarsi(n) {
  return String(n).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}

load();
</script>
</body>
</html>
