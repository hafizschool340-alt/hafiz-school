<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسه حافظ</title>
<link rel="manifest" href="manifest.json">
<style>


*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  background:#FFF8F0;
  color:#333;direction:rtl;min-height:100vh;
  overflow-x:hidden;
}

/* ══════════ HEADER ══════════ */
.header{
  background:linear-gradient(160deg,#7C3AED,#EC4899);
  color:white;padding:30px 20px 50px;
  text-align:center;position:relative;
  overflow:hidden;
}
.header::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:40px;
  background:#FFF8F0;
  clip-path:ellipse(55% 100% at 50% 100%);
}
/* ستارههای تزئینی */
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;font-size:1.4rem;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:0.3;transform:scale(0.8)}to{opacity:1;transform:scale(1.1)}}

.logo-wrap{
  width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  font-size:3rem;
  box-shadow:0 4px 24px rgba(0,0,0,0.15);
  border:3px solid rgba(255,255,255,0.4);
}
.header h1{font-size:2rem;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.header p{font-size:1rem;opacity:0.9;margin-top:6px;font-weight:700}

.stats{
  display:flex;justify-content:center;gap:20px;margin-top:18px;
}
.stat-pill{
  background:rgba(255,255,255,0.25);
  border-radius:40px;padding:8px 20px;
  display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(4px);
  border:1.5px solid rgba(255,255,255,0.3);
}
.stat-num{font-size:1.5rem;font-weight:900}
.stat-lbl{font-size:0.85rem;opacity:0.9;font-weight:700}

/* ══════════ CONTAINER ══════════ */
.container{max-width:640px;margin:0 auto;padding:24px 16px 40px}

/* ══════════ SESSION GRID ══════════ */
.section-title{
  text-align:center;font-size:1rem;font-weight:700;color:#7C3AED;
  margin-bottom:16px;letter-spacing:0.5px;
}

.session-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:28px;
}
@media(max-width:400px){.session-grid{grid-template-columns:1fr}}

/* رنگهای جلسه */
.sc-colors{
  --c0: linear-gradient(135deg,#7C3AED,#A855F7);
  --c1: linear-gradient(135deg,#EC4899,#F472B6);
  --c2: linear-gradient(135deg,#F59E0B,#FBBF24);
  --c3: linear-gradient(135deg,#10B981,#34D399);
  --c4: linear-gradient(135deg,#3B82F6,#60A5FA);
  --c5: linear-gradient(135deg,#EF4444,#F87171);
  --c6: linear-gradient(135deg,#8B5CF6,#C084FC);
  --c7: linear-gradient(135deg,#06B6D4,#22D3EE);
}

.session-btn{
  border:none;cursor:pointer;font-family:inherit;
  border-radius:24px;padding:0;overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
  transition:transform 0.18s, box-shadow 0.18s;
  position:relative;
}
.session-btn:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,0.18)}
.session-btn:active{transform:translateY(-1px)}

.session-btn-inner{
  padding:20px 16px 16px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:white;
}
.session-emoji{font-size:2.6rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))}
.session-label{font-size:1.1rem;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,0.2)}
.session-count{
  background:rgba(255,255,255,0.3);
  border-radius:20px;padding:4px 14px;
  font-size:0.82rem;font-weight:700;
  backdrop-filter:blur(4px);
}

/* ══════════ LESSON LIST PAGE ══════════ */
.page{display:none}
.page.active{display:block}

.back-btn{
  display:flex;align-items:center;gap:8px;
  background:white;border:none;cursor:pointer;font-family:inherit;
  color:#7C3AED;font-size:1rem;font-weight:700;
  padding:10px 18px;border-radius:40px;
  box-shadow:0 2px 10px rgba(124,58,237,0.15);
  margin-bottom:20px;transition:background 0.15s;
}
.back-btn:hover{background:#f3eeff}

.session-page-title{
  text-align:center;margin-bottom:20px;
}
.session-page-title h2{font-size:1.5rem;font-weight:900;color:#7C3AED}
.session-page-title p{font-size:0.85rem;color:#aaa;margin-top:4px}

/* ══════════ LESSON CARD ══════════ */
.lesson-card{
  background:white;border-radius:22px;
  padding:16px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.07);
  border:2px solid #F3E8FF;
  overflow:hidden;
}
.lesson-card:last-child{margin-bottom:0}

.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lesson-num-bubble{
  min-width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#7C3AED,#EC4899);
  color:white;font-size:1rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(124,58,237,0.3);
  flex-shrink:0;
}
.lesson-info{flex:1}
.lesson-title{font-size:1rem;font-weight:800;color:#222;line-height:1.3}
.lesson-meta{font-size:0.78rem;color:#bbb;margin-top:3px}
.lesson-desc{font-size:0.85rem;color:#777;margin-bottom:12px;line-height:1.7;padding-right:4px}

/* ══════════ VIDEO ══════════ */
.video-wrap{position:relative;border-radius:16px;overflow:hidden;background:#1a1a2e;min-height:160px}
video{width:100%;border-radius:16px;background:#111;max-height:240px;display:block}

.video-thumb{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#2d1b69,#1a1a2e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border-radius:16px;transition:background 0.2s;
}
.video-thumb:hover{background:linear-gradient(160deg,#3d2a7a,#2a1a4e)}
.video-thumb.hide{display:none}

.play-btn{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#EC4899,#7C3AED);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;
  box-shadow:0 6px 24px rgba(236,72,153,0.5);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 6px 24px rgba(236,72,153,0.5)}
  50%{box-shadow:0 6px 36px rgba(236,72,153,0.8),0 0 0 10px rgba(236,72,153,0.1)}
}
.play-btn svg{width:32px;height:32px;fill:white;margin-right:-4px}
.play-label{color:white;font-size:0.95rem;font-weight:700;opacity:0.9}

.video-buffering{
  position:absolute;inset:0;
  background:rgba(26,26,46,0.9);
  display:none;align-items:center;justify-content:center;
  border-radius:16px;flex-direction:column;gap:10px;
  color:white;font-size:0.85rem;
}
.video-buffering.show{display:flex}
.spinner-sm{width:30px;height:30px;border:3px solid rgba(255,255,255,0.2);border-top-color:#EC4899;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════ STATES ══════════ */
.empty{text-align:center;padding:60px 20px;color:#ccc}
.empty-icon{font-size:3.5rem;margin-bottom:14px}
.empty p{font-size:1rem;color:#bbb;font-weight:700}
.loading{text-align:center;padding:60px;color:#9B59B6}
.spinner{width:40px;height:40px;border:4px solid #e8e0f7;border-top-color:#7C3AED;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}

.footer{text-align:center;padding:28px;color:#ccc;font-size:0.8rem}
</style>
</head>
<body>

<!-- ══════ PAGE: HOME ══════ -->
<div class="page active" id="page-home">

  <div class="header">
    <div class="stars">
      <span class="star" style="top:12%;right:8%;animation-delay:0s">⭐</span>
      <span class="star" style="top:20%;left:10%;animation-delay:0.5s">🌟</span>
      <span class="star" style="top:8%;left:35%;animation-delay:1s">✨</span>
      <span class="star" style="top:55%;right:5%;animation-delay:0.3s">⭐</span>
      <span class="star" style="top:40%;left:5%;animation-delay:0.8s">✨</span>
    </div>
    <div class="logo-wrap">📚</div>
    <h1>مدرسه حافظ</h1>
    <p>کهکشان اولیها</p>
    <div class="stats">
      <div class="stat-pill">
        <span class="stat-num" id="totalSessions">۰</span>
        <span class="stat-lbl">جلسه</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="totalLessons">۰</span>
        <span class="stat-lbl">درس</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-title">📖 جلسهات را انتخاب کن</div>
    <div class="session-grid sc-colors" id="sessionGrid">
      <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
    </div>
  </div>

  <div class="footer">مدرسه حافظ © ۱۴۰۳</div>
</div>

<!-- ══════ PAGE: LESSONS ══════ -->
<div class="page" id="page-lessons">
  <div class="header" id="lessonHeader" style="padding-bottom:50px">
    <div class="stars">
      <span class="star" style="top:15%;right:8%;animation-delay:0s">⭐</span>
      <span class="star" style="top:25%;left:12%;animation-delay:0.6s">🌟</span>
      <span class="star" style="top:10%;left:40%;animation-delay:1.1s">✨</span>
    </div>
    <div class="logo-wrap" id="lessonHeaderEmoji" style="font-size:2.5rem">📚</div>
    <h1 id="lessonHeaderTitle">جلسه</h1>
    <p id="lessonHeaderCount"></p>
  </div>

  <div class="container">
    <button class="back-btn" onclick="goHome()">
      ◀ بازگشت به جلسهها
    </button>
    <div id="lessonList"></div>
  </div>

  <div class="footer">مدرسه حافظ © ۱۴۰۳</div>
</div>

<script>
const LESSONS_URL = "https://raw.githubusercontent.com/hafizschool340-alt/hafiz-school/main/lessons.json";
const toF = n => String(n).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

// رنگ و ایموجی هر جلسه
const SESSION_STYLES = [
  { grad:"linear-gradient(135deg,#7C3AED,#A855F7)", emoji:"🌙" },
  { grad:"linear-gradient(135deg,#EC4899,#F472B6)", emoji:"⭐" },
  { grad:"linear-gradient(135deg,#F59E0B,#FBBF24)", emoji:"🌞" },
  { grad:"linear-gradient(135deg,#10B981,#34D399)", emoji:"🌿" },
  { grad:"linear-gradient(135deg,#3B82F6,#60A5FA)", emoji:"🦋" },
  { grad:"linear-gradient(135deg,#EF4444,#F87171)", emoji:"🌸" },
  { grad:"linear-gradient(135deg,#8B5CF6,#C084FC)", emoji:"🎨" },
  { grad:"linear-gradient(135deg,#06B6D4,#22D3EE)", emoji:"🌊" },
  { grad:"linear-gradient(135deg,#F97316,#FB923C)", emoji:"🦁" },
  { grad:"linear-gradient(135deg,#84CC16,#A3E635)", emoji:"🌈" },
];

let allSessions = {};

async function loadData() {
  try {
    const r = await fetch(LESSONS_URL + "?t=" + Date.now());
    const lessons = await r.json();

    if (!lessons.length) {
      document.getElementById("sessionGrid").innerHTML =
        '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📝</div><p>هنوز درسی اضافه نشده</p></div>';
      return;
    }

    // گروهبندی بر اساس جلسه، sort صعودی
    allSessions = {};
    lessons.forEach(l => {
      if (!allSessions[l.session]) allSessions[l.session] = [];
      allSessions[l.session].push(l);
    });
    const sortedKeys = Object.keys(allSessions).map(Number).sort((a,b) => a-b);

    document.getElementById("totalSessions").textContent = toF(sortedKeys.length);
    document.getElementById("totalLessons").textContent  = toF(lessons.length);

    // ساخت grid کارتها
    const grid = document.getElementById("sessionGrid");
    grid.innerHTML = "";
    sortedKeys.forEach((sNum, i) => {
      const style = SESSION_STYLES[i % SESSION_STYLES.length];
      const count = allSessions[sNum].length;

      const btn = document.createElement("button");
      btn.className = "session-btn";
      btn.style.background = style.grad;
      btn.innerHTML =
        '<div class="session-btn-inner">' +
          '<span class="session-emoji">' + style.emoji + '</span>' +
          '<span class="session-label">جلسه ' + toF(sNum) + '</span>' +
          '<span class="session-count">' + toF(count) + ' درس</span>' +
        '</div>';
      btn.addEventListener("click", () => openSession(sNum, style));
      grid.appendChild(btn);
    });

  } catch(e) {
    document.getElementById("sessionGrid").innerHTML =
      '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">❌</div><p>خطا در بارگذاری</p></div>';
  }
}

function openSession(sNum, style) {
  const lessons = allSessions[sNum];

  // آپدیت header صفحه درسها
  const hdr = document.getElementById("lessonHeader");
  hdr.style.background = style.grad.replace("linear-gradient","linear-gradient");
  document.getElementById("lessonHeaderEmoji").textContent  = style.emoji;
  document.getElementById("lessonHeaderTitle").textContent  = "جلسه " + toF(sNum);
  document.getElementById("lessonHeaderCount").textContent  = toF(lessons.length) + " درس";

  // ساخت کارتها
  const list = document.getElementById("lessonList");
  list.innerHTML = "";
  lessons.forEach((lesson, li) => {
    list.appendChild(buildLessonCard(lesson, li));
  });

  // سوئیچ صفحه
  document.getElementById("page-home").classList.remove("active");
  document.getElementById("page-lessons").classList.add("active");
  window.scrollTo(0, 0);
}

function goHome() {
  document.getElementById("page-lessons").classList.remove("active");
  document.getElementById("page-home").classList.add("active");
  window.scrollTo(0, 0);
}

function buildLessonCard(lesson, li) {
  const lc = document.createElement("div");
  lc.className = "lesson-card";

  lc.innerHTML =
    '<div class="lesson-top">' +
      '<div class="lesson-num-bubble">' + toF(li+1) + '</div>' +
      '<div class="lesson-info">' +
        '<div class="lesson-title">' + lesson.title + '</div>' +
        '<div class="lesson-meta">' + (lesson.date && /^[\u0600-\u06ff\d\/\s]+$/.test(lesson.date) ? lesson.date : "") + (lesson.duration && /^[\d\u06f0-\u06f9\s]+$/.test(String(lesson.duration)) ? "  ⏱ "+toF(lesson.duration)+" دقیقه" : "") + '</div>' +
      '</div>' +
    '</div>' +
    (lesson.description ? '<div class="lesson-desc">' + lesson.description + '</div>' : '');

  // Video wrap
  const wrap = document.createElement("div");
  wrap.className = "video-wrap";

  const vid = document.createElement("video");
  vid.controls = true;
  vid.playsInline = true;
  wrap.appendChild(vid);

  const buf = document.createElement("div");
  buf.className = "video-buffering";
  buf.innerHTML = '<div class="spinner-sm"></div><span>در حال بارگذاری...</span>';
  wrap.appendChild(buf);

  const thumb = document.createElement("div");
  thumb.className = "video-thumb";
  thumb.innerHTML =
    '<div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' +
    '<span class="play-label">▶ برای پخش کلیک کنید</span>';

  thumb.addEventListener("click", () => {
    thumb.classList.add("hide");
    buf.classList.add("show");
    vid.src = lesson.videoUrl;
    vid.load();
    vid.addEventListener("canplay", () => { buf.classList.remove("show"); vid.play(); }, { once:true });
    vid.addEventListener("error",   () => {
      buf.classList.remove("show");
      buf.innerHTML = '<span>❌ خطا در بارگذاری ویدیو</span>';
      buf.classList.add("show");
    }, { once:true });
  });

  wrap.appendChild(thumb);
  lc.appendChild(wrap);
  return lc;
}

loadData();
</script>
</body>
</html>
